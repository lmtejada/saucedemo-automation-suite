name: Main Gate

on:
    pull_request:
        branches: [main]

jobs:
    main-gate:
        name: Check Changes introduced to Main branch (cross-browser)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.22.3
                  cache: 'npm'
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Run main gate test suite
              run: npm run test:main-gate
              env:
                  APP_URL: ${{ vars.APP_URL }}
                  PERFORMANCE_USER_NAME: ${{ secrets.PERFORMANCE_USER_NAME }}
                  PROBLEM_USER_NAME: ${{ secrets.PROBLEM_USER_NAME }}
                  USER_NAME: ${{ secrets.USER_NAME }}
                  USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
            - name: Upload HTML report artifact
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: main-gate-report
                  path: playwright-report/
                  retention-days: 30
            - name: Deploy report to GitHub Pages
              id: deploy-pages
              if: ${{ !cancelled() }}
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./playwright-report
                  destination_dir: changes-report
                  keep_files: true
            # Chained to the deploy step's own outcome, not just !cancelled(), so a failed
            # deploy (e.g. a gh-pages push race) doesn't print a link to a stale report.
            - name: Summarize report URL
              if: ${{ !cancelled() && steps.deploy-pages.outcome == 'success' }}
              run: echo "📊 [View the cross-browser test report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/changes-report/)" >> "$GITHUB_STEP_SUMMARY"
