name: Update Playwright Visual Snapshots

on:
    # Allows manual trigger from GitHub UI
    workflow_dispatch:

jobs:
    update-playwright-snapshots:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref || github.ref_name }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.22.3
                  cache: 'npm'

            - name: Install Dependencies
              run: npm ci

            - name: Install Playwright Browsers with Dependencies
              run: npx playwright install --with-deps

            - name: Generate Visual Snapshots in CI Environment
              run: npx playwright test --grep @visual --update-snapshots
              env:
                  APP_URL: ${{ vars.APP_URL }}
                  PERFORMANCE_USER_NAME: ${{ secrets.PERFORMANCE_USER_NAME }}
                  PROBLEM_USER_NAME: ${{ secrets.PROBLEM_USER_NAME }}
                  USER_NAME: ${{ secrets.USER_NAME }}
                  USER_PASSWORD: ${{ secrets.USER_PASSWORD }}

            - name: Commit Updated Snapshots to Branch
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  commit_message: 'chore(visual): update visual regression snapshots [skip ci]'
                  file_pattern: 'tests/__snapshots__/**'
