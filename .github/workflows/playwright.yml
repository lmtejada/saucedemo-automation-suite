name: Playwright Tests
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [master]
jobs:
    playwright-tests:
        name: Playwright Tests
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22.22.3
            - name: Install dependencies
              run: npm ci
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            - name: Run Playwright tests
              run: npm run test:ci
              env:
                  APP_URL: ${{ vars.APP_URL }}
                  PERFORMANCE_USER_NAME: ${{ secrets.PERFORMANCE_USER_NAME }}
                  PROBLEM_USER_NAME: ${{ secrets.PROBLEM_USER_NAME }}
                  USER_NAME: ${{ secrets.USER_NAME }}
                  USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
            - name: Upload HTML report artifact
              uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
            - name: Deploy report to GitHub Pages
              if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./playwright-report
                  destination_dir: report
                  keep_files: true
            - name: Summarize report URL
              if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
              run: echo "📊 [View the test report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/report/)" >> "$GITHUB_STEP_SUMMARY"
