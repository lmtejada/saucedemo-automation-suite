name: PR Agent (Gemini Summary)

on:
    pull_request:
        types: [opened, synchronize]

jobs:
    pr_agent_job:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write
            contents: read
            issues: write
        name: Run PR Agent
        steps:
            - name: PR Agent Action
              uses: the-pr-agent/pr-agent@main
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CONFIG.MODEL: 'gemini/gemini-1.5-flash'
                  CONFIG.FALLBACK_MODELS: '["gemini/gemini-1.5-pro"]'
                  GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
